[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synthid-text"
version = "0.2.1"
authors = [
  { name="DeepMind Technologies Limited" },
]
description = "SynthID Text: Identifying AI-generated text content"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  # flax<0.12.8 calls jax.core.get_opaque_trace_state, removed in jax 0.11.
  "flax>=0.12.8",
  "immutabledict>=4.2",
  # CPU build by default; only the Bayesian detector uses JAX. Install the
  # `cuda` extra to train it on GPU.
  "jax",
  "jaxtyping",
  "numpy>=2.0",
  "optax",
  "scikit-learn",
  "torch>=2.5",
  "tqdm",
  "transformers>=5.16,<6",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
keywords = [
  "artificial intelligence",
  "language models",
  "machine learning",
  "text generation",
  "watermarking",
]

[project.urls]
"Homepage" = "https://deepmind.google/technologies/synthid/"
"Repository" = "https://github.com/google-deepmind/synthid-text"
"Bug Tracker" = "https://github.com/google-deepmind/synthid-text/issues"
"Demo" = "https://colab.research.google.com/github/google-deepmind/synthid-text/blob/main/notebooks/synthid_text_huggingface_integration.ipynb"

[project.optional-dependencies]
cuda = [
  "jax[cuda]",
]

notebook = [
  # Needed for device_map="auto".
  "accelerate",
  "datasets",
  "huggingface_hub",
  "ipywidgets",
  "pandas",
]

notebook-local = [
  "synthid-text[notebook]",
  "notebook",
]

test = [
  "absl-py",
  "mock",
  "pytest",
]
